<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperBar Search</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #superbar-container {
        width: 100%;
        height: 100%;
      }

      #superbar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999998;
      }

      #superbar-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        border-radius: 8px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 600px;
        z-index: 999999;
        max-height: 80vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      #superbar-header {
        display: flex;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid #e5e7eb;
      }

      #superbar-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #superbar-close {
        font-size: 24px;
        cursor: pointer;
        color: #6b7280;
        margin-left: 12px;
        font-weight: bold;
        transition: color 0.2s;
      }

      #superbar-close:hover {
        color: #111827;
      }

      #superbar-results {
        overflow-y: auto;
        max-height: calc(80vh - 60px);
      }

      .superbar-loading,
      .superbar-no-results {
        padding: 20px 16px;
        text-align: center;
        color: #6b7280;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
      }

      .superbar-result {
        padding: 12px 16px;
        border-bottom: 1px solid #f3f4f6;
        cursor: pointer;
        transition: background 0.15s;
        display: flex;
        align-items: center;
      }

      .superbar-result:hover {
        background: #f9fafb;
      }

      .superbar-result.selected {
        background: #dbeafe;
        border-left: 4px solid #2563eb;
        padding-left: 12px;
        box-shadow: inset 0 0 0 1px #93c5fd;
      }

      .superbar-result-content {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .superbar-favicon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .superbar-result-text {
        flex: 1;
        min-width: 0;
      }

      .superbar-result-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #1f2937;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .superbar-result-url {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        color: #9ca3af;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div id="superbar-container">
      <div id="superbar-overlay"></div>
      <div id="superbar-modal">
        <div id="superbar-header">
          <input
            type="text"
            id="superbar-input"
            placeholder="Search bookmarks..."
            autocomplete="off"
          />
          <span id="superbar-close">×</span>
        </div>
        <div id="superbar-results"></div>
      </div>
    </div>

    <script src="search-overlay.js"></script>
  </body>
</html>
