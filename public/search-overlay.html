<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperBar Search</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #superbar-container {
        width: 100%;
        height: 100%;
      }

      #superbar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 999998;
      }

      #superbar-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #1f2937;
        border-radius: 8px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        width: 90%;
        max-width: 600px;
        z-index: 999999;
        max-height: 80vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      #superbar-header {
        display: flex;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid #374151;
        background: #1f2937;
      }

      #superbar-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #111827;
        color: #f3f4f6;
        padding: 8px 12px;
        border-radius: 4px;
      }

      #superbar-input::placeholder {
        color: #9ca3af;
      }

      #superbar-close {
        font-size: 24px;
        cursor: pointer;
        color: #9ca3af;
        margin-left: 12px;
        font-weight: bold;
        transition: color 0.2s;
        background: transparent;
        border: none;
        padding: 0;
      }

      #superbar-close:hover {
        color: #f3f4f6;
      }

      #superbar-results {
        overflow-y: auto;
        max-height: calc(80vh - 60px);
        background: #1f2937;
      }

      .superbar-loading,
      .superbar-no-results {
        padding: 20px 16px;
        text-align: center;
        color: #9ca3af;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        background: #1f2937;
      }

      .superbar-result {
        padding: 12px 16px;
        border-bottom: 1px solid #374151;
        cursor: pointer;
        transition: background 0.15s;
        display: flex;
        align-items: center;
        background: #1f2937;
        color: #f3f4f6;
      }

      .superbar-result:hover {
        background: #111827;
      }

      .superbar-result.selected {
        background: #1e40af;
        border-left: 4px solid #3b82f6;
        padding-left: 12px;
        box-shadow: inset 0 0 0 1px #1e3a8a;
      }

      .superbar-result-content {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .superbar-favicon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .superbar-result-text {
        flex: 1;
        min-width: 0;
      }

      .superbar-result-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #f3f4f6;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .superbar-result-path {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        color: #4b5563;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
        margin-bottom: 2px;
      }

      .superbar-result-url {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        color: #6b7280;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }

      .superbar-result-actions {
        position: relative;
        margin-left: auto;
        padding-left: 8px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
      }

      .superbar-action-btn {
        background: transparent;
        border: none;
        color: #9ca3af;
        cursor: pointer;
        font-size: 18px;
        padding: 4px 8px;
        transition: color 0.2s;
      }

      .superbar-action-btn:hover {
        color: #f3f4f6;
      }

      .superbar-action-menu {
        position: absolute;
        right: 0;
        top: 100%;
        background: #374151;
        border: 1px solid #4b5563;
        border-radius: 4px;
        min-width: 160px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        margin-top: 4px;
      }

      .superbar-action-item {
        display: block;
        width: 100%;
        padding: 8px 12px;
        background: transparent;
        border: none;
        color: #f3f4f6;
        text-align: left;
        cursor: pointer;
        font-size: 13px;
        font-family: inherit;
        transition: background 0.2s;
      }

      .superbar-action-item:first-child {
        border-radius: 3px 3px 0 0;
      }

      .superbar-action-item:last-child {
        border-radius: 0 0 3px 3px;
      }

      .superbar-action-item:hover {
        background: #4b5563;
      }

      .superbar-result-usage {
        font-size: 13px;
        color: #60a5fa;
        font-weight: 600;
        margin-left: 12px;
        padding: 2px 6px;
        background: rgba(96, 165, 250, 0.1);
        border-radius: 3px;
        white-space: nowrap;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="superbar-container">
      <div id="superbar-overlay"></div>
      <div id="superbar-modal">
        <div id="superbar-header">
          <input
            type="text"
            id="superbar-input"
            placeholder="Search bookmarks..."
            autocomplete="off"
          />
          <span id="superbar-close">×</span>
        </div>
        <div id="superbar-results"></div>
      </div>
    </div>

    <script src="search-overlay.js"></script>
  </body>
</html>
