<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperBar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 300px;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1f2937;
      }

      .header {
        text-align: center;
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 20px;
        font-weight: 700;
        color: #f3f4f6;
        margin-bottom: 8px;
      }

      .header p {
        font-size: 14px;
        color: #9ca3af;
      }

      .shortcut-info {
        background: #111827;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        border: 1px solid #374151;
      }

      .shortcut-label {
        font-size: 12px;
        color: #9ca3af;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .shortcut-key {
        font-size: 16px;
        font-weight: 600;
        color: #3b82f6;
        font-family: 'Courier New', monospace;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        padding: 12px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-primary {
        background-color: #3b82f6;
        color: white;
      }

      .btn-primary:hover {
        background-color: #2563eb;
      }

      .btn-secondary {
        background-color: #374151;
        color: #f3f4f6;
        border: 1px solid #4b5563;
      }

      .btn-secondary:hover {
        background-color: #4b5563;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .status {
        text-align: center;
        font-size: 12px;
        color: #10b981;
        margin-top: 12px;
        min-height: 18px;
      }

      .icon {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🔍 SuperBar</h1>
      <p>Bookmark Search</p>
    </div>

    <div class="shortcut-info">
      <div class="shortcut-label">Current Shortcut</div>
      <div class="shortcut-key" id="current-shortcut">Loading...</div>
    </div>

    <div class="buttons">
      <button id="reload-btn" class="btn btn-primary">
        <span class="icon">🔄</span>
        Reload Extension
      </button>

      <button id="settings-btn" class="btn btn-secondary">
        <span class="icon">⚙️</span>
        Settings
      </button>
    </div>

    <div class="status" id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
