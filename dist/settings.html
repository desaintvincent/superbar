<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperBar Settings</title>
    <link rel="stylesheet" href="settings-styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>SuperBar Settings</h1>
        <p>Configure your SuperBar extension</p>
      </div>

      <form id="settings-form" class="settings-form">
        <div class="form-group">
          <label for="enabled">
            <input
              type="checkbox"
              id="enabled"
              name="enabled"
              checked
            />
            Enable SuperBar
          </label>
          <p class="help-text">Toggle the extension on/off</p>
        </div>

        <div class="form-group">
          <label for="shortcut">Keyboard Shortcut</label>
          <div class="shortcut-input-group">
            <input
              type="text"
              id="shortcut"
              name="shortcut"
              placeholder="e.g., Ctrl+Shift+K"
              value="Ctrl+Shift+K"
              readonly
            />
            <button type="button" id="record-shortcut" class="btn btn-secondary">
              Record Shortcut
            </button>
          </div>
          <p class="help-text">Press the shortcut to open SuperBar on any page</p>
          <p id="recording-hint" class="recording-hint" style="display: none">
            Press your desired key combination (press Escape to cancel)
          </p>
        </div>

        <div class="form-group">
          <label>Search Engines</label>
          <div class="checkbox-group">
            <label>
              <input type="checkbox" name="searchEngine" value="google" checked />
              Google
            </label>
            <label>
              <input type="checkbox" name="searchEngine" value="wikipedia" />
              Wikipedia
            </label>
            <label>
              <input type="checkbox" name="searchEngine" value="github" />
              GitHub
            </label>
            <label>
              <input type="checkbox" name="searchEngine" value="stackoverflow" />
              Stack Overflow
            </label>
          </div>
          <p class="help-text">Select search engines to use in SuperBar</p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Settings</button>
          <button type="button" id="reset-btn" class="btn btn-secondary">
            Reset to Defaults
          </button>
        </div>
      </form>

      <div id="status-message" class="status-message" style="display: none"></div>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
